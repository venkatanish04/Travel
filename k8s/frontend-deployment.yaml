apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelraft-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelraft-frontend
  template:
    metadata:
      labels:
        app: travelraft-frontend
    spec:
      containers:
        - name: frontend
          image: travelraft-frontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
