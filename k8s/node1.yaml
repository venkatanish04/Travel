apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelraft-node1
  namespace: travelraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelraft
      node: node1
  template:
    metadata:
      labels:
        app: travelraft
        node: node1
    spec:
      containers:
        - name: server
          image: travelraft:latest
          imagePullPolicy: Never
          command: ["./travelraft-server"]
          args: ["--id=node1", "--port=50051"]
          ports:
            - containerPort: 50051
          env:
            - name: TRAVELRAFT_ENV
              value: kubernetes
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              value: root
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: travelraft
            - name: NODE_ID
              value: node1
            - name: PORT
              value: "50051"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 5
