apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelraft-node2
  namespace: travelraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelraft
      node: node2
  template:
    metadata:
      labels:
        app: travelraft
        node: node2
    spec:
      containers:
        - name: server
          image: travelraft:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ID
              value: node2
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: travelraft-data
